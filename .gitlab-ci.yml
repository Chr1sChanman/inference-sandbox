# .gitlab-ci.yml - Initial starting pipeline

stages:
  - lint
  - test

lint:python:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install flake8 --quiet
    - flake8 benchmark.py --max-line-length=120
  only:
    - merge_requests
    - main

test:run:
  stage: test
  image: python:3.11-slim
  script:
    - pip install pytest --quiet
    - pytest test_benchmark.py
  only:
    - merge_requests
    - main