---

stages:
  - lint
  - test
  - build

lint:python:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install ruff --quiet
    - ruff check benchmark.py --line-length=120
  only:
    - merge_requests
    - main

test:run:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt --quiet
    - pytest test_benchmark.py
  only:
    - merge_requests
    - main

build-and-push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA $CI_REGISTRY/$CI_PROJECT_PATH:latest
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH:latest
  only:
    - merge_requests
    - main
