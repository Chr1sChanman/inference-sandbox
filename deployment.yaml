apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-sandbox
  labels:
    app: inference-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-sandbox
  template:
    metadata:
      labels:
        app: inference-sandbox
    spec:
      containers:
        - name: benchmark
          image: inference-sandbox:v2
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: inference-config
                  key: redis-host
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
