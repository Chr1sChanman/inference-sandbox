apiVersion: v1
kind: Deployment
metadata:
  name: inference-sandbox
  labels:
    app: inference-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-sandbox
    template:
      metadata:
        labels:
          app: inference-sandbox
      spec:
        containers:
          - name: benchmark
            image: inference-sandbox:v2
            command: ["python", "benchmark.py"]
            env:
              - name: REDIS_HOST
                valueFrom:
                  configMapKeyRef:
                    name: inference-config
                    key: redis-host
                resources:
                  requests:
                    cpu: "250m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "256Mi"