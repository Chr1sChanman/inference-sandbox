[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
  "integration: requires Ollama, local models, and NVIDIA GPU access",
  "k8s: requires a reachable Kubernetes cluster",
  "system: requires Kubernetes cluster access",
  "slow: takes more than a few seconds (perplexity, large corporation)",
  "gpu: requires CUDA-capable GPU",
]

[tool.ruff]
line-length = 120
target-version = "py311"
