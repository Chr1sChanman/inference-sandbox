[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-sandbox"
version = "0.1.0"
description = "Local deep-learning infrastructure and inference SDET sandbox"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -ra -v"
markers = [
    "integration: requires Ollama, local models, services, or NVIDIA GPU access",
    "system: requires Kubernetes cluster access",
    "k8s: requires a reachable Kubernetes cluster",
    "slow: takes more than a few seconds",
    "gpu: requires CUDA-capable GPU",
]

[tool.ruff]
line-length = 120
target-version = "py311"