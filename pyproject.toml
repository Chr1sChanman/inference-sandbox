[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -ra"
markers = [
  "integration: requires a local service (ollama/vllm/redis)",
  "k8s: requires a reachable Kubernetes cluster",
  "slow: takes more than a few seconds (perplexity, large corporation)",
  "gpu: requires CUDA-capable GPU",
]

[tool.ruff]
line-length = 120
target-version = "py311"
